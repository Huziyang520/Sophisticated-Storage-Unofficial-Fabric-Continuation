# === Gradle 版本锁定 ===
# 档位：26.x 线最新档 9.7.1（Loom 1.17.x 要求 Gradle 9.4+）
# 约束来源：net.fabricmc.fabric-loom 1.17.21（26.3 Fabric 线）
# 复用本机缓存：是（~/.gradle/wrapper/dists 已缓存 gradle-9.7.1-bin，URL 与下方一致 → 不触发下载）
# 镜像：沿用 services.gradle.org（本机缓存即由该 URL 建立；腾讯云镜像会换哈希目录而重新下载）
# 上次实测：2026-10-16 · ./gradlew --offline help 配置阶段通过
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
networkTimeout=10000
retries=0
retryBackOffMs=500
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

# === 项目基本信息 ===
# mod_name 是展示名（驱动 fabric 的 name / CF displayName / jar 的 Specification-Title）
mod_id=sophisticatedstorage
mod_name=Sophisticated Storage
mod_group_id=sophisticatedstorage
# version 只写 mod 版本，不带 MC 前缀（产物名由 build.gradle 拼成 <mod_id>-<version>-<loader>-<MC>）
mod_version=1.5.123.2187
mod_authors=P3pp3rF1y, Salandora, Huziyang520
mod_license=GNU General Public License v3.0
mod_description=[EN] Fancy and functional storage containers: upgradable chests, barrels, limited barrels and shulker boxes. [CN] 精致而实用的存储容器：可升级的箱子、桶、限量桶与潜影盒。 | Feedback: https://issue.mengcai.online/
mod_display_url=https://github.com/Huziyang520/Sophisticated-Storage-Unofficial-Fabric-Continuation
mod_sources_url=https://github.com/Huziyang520/Sophisticated-Storage-Unofficial-Fabric-Continuation
mod_issue_tracker_url=https://github.com/Huziyang520/Sophisticated-Storage-Unofficial-Fabric-Continuation/issues
mod_logo_file=icon.png

# === 目标版本 ===
minecraft_version=26.3
mc_range_label=26.3
# 同一条区间的 Fabric Loader 前缀写法，供 fabric.mod.json 的 minecraft 字段使用
fabric_minecraft_range=>=26.3 <26.4
java_version=25

# Fabric，见 https://fabricmc.net/develop/
fabric_loader_version=0.19.5
fabric_version=0.160.5+26.3

# 依赖区间（内容模组用；核心自身留空）
# 依赖的本系列核心版本（写进 fabric.mod.json 的 depends）
sophisticatedcore_range=>=1.5.13.2406

# === 前置 / 可选联动（仅编译期，除 cloth-config 外都不写进 depends）===
# Cloth Config：配置界面（必选前置，写在 fabric.mod.json 的 depends 里）
cloth_config_version=26.3.159
# Mod Menu：配置入口（可选）
modmenu_version=21.0.0

# --- 26.3 有 Fabric 版，可保留的兼容 ---
jei_version=31.13.0.71
rei_version=26.3.824
